# Per-company XBRL tag mappings. Candidates are listed in priority order. For each exact period the
# first candidate that reports it is used, the tag chosen is stored with every value, and any
# lower-priority candidate that reports a different value is flagged (never silently ignored).
#
# Every entry here comes from `ai-capital-cycle audit-tags <TICKER>` against the company's real
# Company Facts, not from assumption. The evidence and the decisions are written up in
# docs/xbrl_mapping_msft.md.
mappings:
  MSFT:
    revenue:
      statement: income_statement
      expect_non_negative: true
      first_fiscal_year: 2018
      candidates:
        - {taxonomy: us-gaap, tag: RevenueFromContractWithCustomerExcludingAssessedTax}
        - {taxonomy: us-gaap, tag: SalesRevenueNet}
        - {taxonomy: us-gaap, tag: Revenues}
      notes: >-
        Total revenue was tagged Revenues (to 2010), SalesRevenueNet (2009 to 2018) and
        RevenueFromContractWithCustomerExcludingAssessedTax (2016 onward, after ASC 606 was
        adopted). In fiscal 2016-2017 the recast and the original values disagree, so the history
        starts in fiscal 2018, the first year reported on the new basis, where one tag supplies
        every fact with no conflicts. SalesRevenueGoodsNet is a component, not the total, and is
        excluded.
    operating_cash_flow:
      statement: cash_flow_statement
      first_fiscal_year: 2018
      candidates:
        - {taxonomy: us-gaap, tag: NetCashProvidedByUsedInOperatingActivities}
        - {taxonomy: us-gaap, tag: NetCashProvidedByUsedInOperatingActivitiesContinuingOperations}
      notes: >-
        The continuing-operations variant was used only in fiscal 2014-2017. From fiscal 2018 the
        plain tag supplies every fact.
    cash_capex:
      statement: cash_flow_statement
      expect_non_negative: true
      first_fiscal_year: 2018
      candidates:
        - {taxonomy: us-gaap, tag: PaymentsToAcquirePropertyPlantAndEquipment}
      notes: >-
        Reported as a positive cash outflow ("Additions to property and equipment"). Finance-lease
        principal is a separate financing line and is not included.
    finance_lease_principal:
      statement: lease_note_financing_cash_flows
      expect_non_negative: true
      first_fiscal_year: 2018
      candidates:
        - {taxonomy: us-gaap, tag: FinanceLeasePrincipalPayments}
    finance_lease_assets_acquired:
      statement: lease_note_noncash_disclosure
      expect_non_negative: true
      first_fiscal_year: 2018
      candidates:
        - {taxonomy: us-gaap, tag: RightOfUseAssetObtainedInExchangeForFinanceLeaseLiability}
  GOOGL:
    revenue:
      statement: income_statement
      expect_non_negative: true
      first_fiscal_year: 2017
      candidates:
        - {taxonomy: us-gaap, tag: Revenues}
        - {taxonomy: us-gaap, tag: RevenueFromContractWithCustomerExcludingAssessedTax}
      notes: >-
        Total revenue is tagged Revenues for most periods and RevenueFromContractWith
        CustomerExcludingAssessedTax for others, switching by period from fiscal 2019, with zero
        conflicts where both report. The FY2018 10-K says Alphabet adopted Topic 606 on 1 January
        2017 using the modified retrospective method, with earlier periods left on Topic 605, so
        the history starts in fiscal 2017.
    operating_cash_flow:
      statement: cash_flow_statement
      first_fiscal_year: 2017
      candidates:
        - {taxonomy: us-gaap, tag: NetCashProvidedByUsedInOperatingActivities}
      notes: >-
        One tag throughout. Alphabet's 10-Q cash-flow statements are cumulative, so Q2 to Q4 are
        year-to-date differences.
    cash_capex:
      statement: cash_flow_statement
      expect_non_negative: true
      first_fiscal_year: 2017
      candidates:
        - {taxonomy: us-gaap, tag: PaymentsToAcquirePropertyPlantAndEquipment}
      notes: >-
        "Purchases of property and equipment", a cash outflow. Purchases still unpaid at period end
        are disclosed separately as included in accrued liabilities and accounts payable, so cash
        capex lags accrued capex.
    finance_lease_principal:
      statement: lease_note_financing_cash_flows
      expect_non_negative: true
      first_fiscal_year: 2024
      candidates:
        - {taxonomy: us-gaap, tag: FinanceLeasePrincipalPayments}
      notes: >-
        The lease note's "Financing cash flows used for finance leases", reported inside repayments
        of debt. It is not pure principal: fiscal 2025 includes $1.1bn of prepayments for finance
        leases that had not yet commenced, disclosed only as an annual amount. Quarterly facts
        begin in fiscal 2024; the annual-only facts for 2022 and 2023 cannot be split into quarters.
    finance_lease_assets_acquired:
      statement: lease_note_noncash_disclosure
      expect_non_negative: true
      first_fiscal_year: 2024
      candidates:
        - {taxonomy: us-gaap, tag: RightOfUseAssetObtainedInExchangeForFinanceLeaseLiability}

# Reviewed lease treatments. A company that maps finance_lease_principal must state whether other
# infrastructure financing payments exist. "none_disclosed" means the filings were reviewed and no
# such cash-flow line exists; it is a documented finding, not an assumption of zero.
lease_adjustments:
  MSFT:
    other_infrastructure_financing_payments: none_disclosed
    note: >-
      Reviewed the fiscal-2026 10-K (accession 0001193125-26-323660). The financing section of the
      Cash Flows Statements lists debt, common stock issued and repurchased, dividends and "Other,
      net" only, with no financing-obligation, build-to-suit or equipment-financing line.
      Principal paid on finance leases is not a statement line: it is disclosed in the lease note
      as "Financing cash flows from finance leases" and is mapped as finance_lease_principal.
      Whatever else "Other, net" contains is not disclosed and is not adjusted for.
  GOOGL:
    other_infrastructure_financing_payments: none_disclosed
    note: >-
      Reviewed the fiscal-2025 10-K (accession 0001652044-26-000018). The financing section of the
      Cash Flows Statements lists stock-award payments, repurchases, dividends, debt issued and
      repaid, and sales of interests in consolidated entities, with no financing-obligation or
      build-to-suit line. Finance-lease cash flows are inside repayments of debt and are disclosed
      in the lease note, mapped as finance_lease_principal (which includes $1.1bn of fiscal-2025
      prepayments for leases not yet commenced).
